services:
  games-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doro-games-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: service_games
      DB_USER: ${DB_USER:-doro_admin}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      IAM_HOST: auth-api
      IAM_PORT: 8080
      # Doro IAM 내부 API(탈퇴 사용자 목록) 호출자 토큰. IAM 의 DORO_IAM_INTERNAL_TOKENS 에 'games:<토큰>' 으로 등록한 값이다.
      DORO_IAM_INTERNAL_TOKEN: ${DORO_IAM_INTERNAL_TOKEN:-}
      GUARD_GRPC_HOST: guard-api
      GUARD_GRPC_PORT: 9090
      GUARD_HTTP_HOST: guard-api
      GUARD_HTTP_PORT: 8081
      DORO_GUARD_SERVICE_TOKEN: ${DORO_GUARD_SERVICE_TOKEN:-}
      # 받아 주는 토큰의 OAuth 클라이언트(cid). 로그인·세션은 별도 BFF(doro-bff)가 하고 게이트웨이가 Bearer 를 붙여 준다.
      GAMES_OAUTH_CLIENT_ID: ${GAMES_OAUTH_CLIENT_ID:-doro-games}
    networks:
      - doro-network

  games-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: doro-games-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3006:80"
    depends_on:
      - games-api
    networks:
      - doro-network

networks:
  doro-network:
    external: true
    name: doro_doro-network
