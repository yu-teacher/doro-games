# ------------------------------------------------------------------------------
# 도로 게임 천국 게이트웨이 설정 조각 (Doro gateway/nginx.conf 에 수동으로 반영한다)
#
# 게이트웨이 nginx.conf 는 CI 가 배포하지 않으므로 서버에서 직접 복사한 뒤
#   docker exec doro-gateway nginx -t && docker exec doro-gateway nginx -s reload
# 로 반영한다. 반영 전에 기존 파일을 백업해 둔다.
# ------------------------------------------------------------------------------

# 1) http 블록의 upstream 모음에 추가
upstream games_web_upstream {
    server doro-games-web:80;
}

upstream games_api_upstream {
    server doro-games-api:8087;
}

# 2) server(443) 블록에 추가. 블로그의 `location /api/v1/` 과 겹치지 않는다
#    (nginx 는 접두사 location 중 가장 긴 것을 고르며, 정규식 location 은 /games/ 와 맞지 않는다).

# 2-1) API: /games/api/... -> 백엔드의 /api/...  (요청 본문은 점수 JSON 뿐이라 기본 크기 제한이면 충분하다)
location /games/api/ {
    proxy_pass http://games_api_upstream/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 2-2) 웹(PWA). 스크립트는 자기 출처(self)만 허용한다(Canvas 게임이라 외부 SDK 가 없다). 폰트 CSS 만 jsDelivr 를 쓴다.
#      블로그/포털의 CSP 는 건드리지 않는다. location 에 add_header 가 있으면 서버 수준 헤더를 상속하지 않으므로 공통 헤더를 다시 적는다.
#      처음 반영할 때는 Content-Security-Policy-Report-Only 로 바꿔 /csp-report 에 위반이 없는지 보고, 문제가 없으면 강제로 전환한다.
location /games/ {
    proxy_pass http://games_web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Content-Security-Policy;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "0" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; report-uri /csp-report" always;
}

location = /games {
    return 301 /games/;
}
