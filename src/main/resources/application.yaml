server:
  port: 8087

spring:
  application:
    name: doro-games
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:25432}/${DB_NAME:service_games}
    username: ${DB_USER:doro_admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    baseline-on-migrate: true
    table: games_schema_history
    locations: classpath:db/migration

doro:
  iam:
    # 서버 간 내부 API(게이트웨이를 거치지 않는 Docker 내부 주소): Doro 의 영구 탈퇴 사용자 목록 조회
    internal-url: http://${IAM_HOST:localhost}:${IAM_PORT:28080}
    # IAM 내부 API 호출자 인증용 서비스 토큰(IAM 의 DORO_IAM_INTERNAL_TOKENS 에 'games:<이 토큰>' 으로 등록). 값은 환경변수로만 준다.
    internal-token: ${DORO_IAM_INTERNAL_TOKEN:}
    jwks-uri: http://${IAM_HOST:localhost}:${IAM_PORT:28080}/.well-known/jwks.json
    # 도로 게임 천국 BFF 가 받은 OAuth 토큰(cid=도로 게임 천국 클라이언트)만 받아 준다. 다른 클라이언트의 토큰은 거부한다.
    oauth-client-ids: ${GAMES_OAUTH_CLIENT_ID:doro-games}
    # 다른 곳에서 로그아웃하면 이 서비스의 세션도 바로 끝난다(IAM 에 닿지 못하면 통과 = fail-open)
    revocation-check: ${DORO_IAM_REVOCATION_CHECK:ENFORCE}
  guard:
    grpc-host: ${GUARD_GRPC_HOST:localhost}
    grpc-port: ${GUARD_GRPC_PORT:9090}
    http-url: http://${GUARD_HTTP_HOST:localhost}:${GUARD_HTTP_PORT:28081}
    http-timeout-ms: ${GUARD_HTTP_TIMEOUT_MS:5000}
    service-token: ${DORO_GUARD_SERVICE_TOKEN:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # 의존 서비스 상세(DB/Redis 등)는 인증 없이 노출하지 않는다. 상태(UP/DOWN)만 공개된다.
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.doro.games: ${LOG_LEVEL_APP:INFO}
    com.hunnit_beasts.doro.sdk: ${LOG_LEVEL_SDK:INFO}

# 도로 게임 천국 BFF 로그인 (Doro OAuth). 로그인 화면은 Doro 가 담당하고, 도로 게임 천국는 비밀번호를 다루지 않는다.
games:
  auth:
    # embedded(기본): 로그인·세션·토큰 갱신을 이 서비스가 한다. gateway: 별도 서비스(doro-bff)가 하고 게이트웨이가 Bearer 를 붙여 준다.
    # gateway 로 바꾸면 아래 OAuth·세션 설정은 쓰이지 않는다(BFF 쪽 설정이다).
    mode: ${GAMES_AUTH_MODE:embedded}
    client-id: ${GAMES_OAUTH_CLIENT_ID:doro-games}
    authorize-url: ${GAMES_OAUTH_AUTHORIZE_URL:http://localhost:28080/oauth2/authorize}
    token-url: ${GAMES_OAUTH_TOKEN_URL:http://${IAM_HOST:localhost}:${IAM_PORT:28080}/oauth2/token}
    revoke-url: ${GAMES_OAUTH_REVOKE_URL:http://${IAM_HOST:localhost}:${IAM_PORT:28080}/oauth2/revoke}
    redirect-uri: ${GAMES_OAUTH_REDIRECT_URI:http://localhost:3006/games/api/v1/bff/callback}
    cookie-secure: ${GAMES_COOKIE_SECURE:true}
    # 웹이 마운트된 하위 경로. 세션 쿠키 Path 와 로그인 후 이동 경로의 접두사. 게이트웨이가 /games 를 떼고 전달하므로 API 경로는 /api/v1 그대로다.
    web-base-path: ${GAMES_WEB_BASE_PATH:/games}
    # 세션 쿠키의 Path. 웹 하위 경로와 같게 둔다(같은 도메인의 다른 서비스에 쿠키가 가지 않게).
    cookie-path: ${GAMES_WEB_BASE_PATH:/games}
    # DB 에 저장하는 토큰을 암호화하는 키(base64 32바이트). 기본값 없음: openssl rand -base64 32
    session-encryption-key: ${GAMES_SESSION_KEY:}

# 점수 타당성 규칙: 서버가 잰 판 시간 안에 낼 수 있는 최대 점수. 규칙이 없는 게임은 기록을 받지 않는다.
  scoring:
    network-tolerance-ms: ${GAMES_SCORE_TOLERANCE_MS:3000}
    rules:
      runner:
        max-points-per-second: ${GAMES_RUNNER_MAX_PPS:25}
      # 2048: 한 수에 최대 8번 합쳐질 수 있고 사람이 초당 몇 수 두는지에 한계가 있다. 이론상 최대 점수(4x4 에서 131072 까지)는 3,932,156 이다.
      "2048":
        max-points-per-second: ${GAMES_2048_MAX_PPS:600}
        max-score: 3932156
      # 귤 폭격 도로롱: 점검용 봇이 10초 구간에서 낸 최고 점수율이 초당 약 3200점이었다(귤 덩어리를 많이 부술수록 보너스·콤보로 빨리 쌓인다).
      # 보스 처치 보너스와 돈다발(2배)의 순간 폭발을 감안해 그 약 3배로 넉넉히 잡는다. 정밀한 검증은 입력 재생(replay)으로 한다.
      orange-blitz:
        max-points-per-second: ${GAMES_ORANGE_BLITZ_MAX_PPS:10000}

  # Doro 에서 영구 탈퇴한 사용자의 게임 프로필 개인정보를 주기적으로 익명화한다 (Doro 내부 API 를 조회).
  deleted-sync:
    enabled: ${GAMES_DELETED_SYNC_ENABLED:true}
    interval: ${GAMES_DELETED_SYNC_INTERVAL:PT1H}
