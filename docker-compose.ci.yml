# CI 전용 일회용 스택: 테스트가 필요로 하는 Postgres / Redis / Guard를 격리해서 띄운다.
# 개발·운영 DB 에 접속하지 않는다. scripts/ci-test.sh 가 올리고 내린다 (직접 쓸 때: docker compose -p games-ci -f docker-compose.ci.yml up -d --build).
# Guard 는 Doro 레포(형제 디렉터리, DORO_DIR)의 소스를 빌드해서 쓴다.
name: games-ci

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: doro_iam
      POSTGRES_USER: doro_admin
      POSTGRES_PASSWORD: ${CI_DB_PASSWORD:-ci-only-password}
      POSTGRES_MULTIPLE_DATABASES: doro_guard,service_games
    volumes:
      - ${DORO_DIR:-../Doro}/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${CI_DB_PORT:-25432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doro_admin -d doro_iam"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  guard-api:
    build:
      context: ${DORO_DIR:-../Doro}/guard
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/doro_guard
      SPRING_DATASOURCE_USERNAME: doro_admin
      SPRING_DATASOURCE_PASSWORD: ${CI_DB_PASSWORD:-ci-only-password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      PORT: 8081
      GRPC_PORT: 9090
      DORO_GUARD_SECURITY_MODE: "OFF"
      DORO_GUARD_VALIDATION_MODE: WARN
    ports:
      - "127.0.0.1:${CI_GUARD_HTTP_PORT:-28081}:8081"
      - "127.0.0.1:${CI_GUARD_GRPC_PORT:-9090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
